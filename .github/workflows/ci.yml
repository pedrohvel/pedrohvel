name: portfolio-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall projects/medallion-pipeline-reference/src

      - name: Run unit tests
        run: python -m unittest discover -s projects/medallion-pipeline-reference/tests -v

      - name: Run sample pipeline
        run: |
          python projects/medallion-pipeline-reference/src/pipeline.py \
            --input projects/medallion-pipeline-reference/data/orders.jsonl \
            --output /tmp/medallion-output
          test -f /tmp/medallion-output/gold_daily_revenue.csv
